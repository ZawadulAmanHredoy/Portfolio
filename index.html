    <!-- Critical Dark Background Inline Styles -->
    <style>
      html, body {
        background-color: #050505;
        color: #f2f2ee;

        padding: 0;
        font-family: 'Geist', system-ui, -apple-system, sans-serif;

      ::selection {
        background: #f2f2ee;

      }
      ::-webkit-scrollbar-track {

      }
      ::-webkit-scrollbar-thumb {
        background: #262626;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #404040;
      }
    </style>
